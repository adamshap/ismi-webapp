name: Update ISMI from BEA
on:
  schedule:
    - cron: '17 15,21 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Validate only, update, or rebuild the full benchmark'
        type: choice
        options: [validate, update, benchmark]
        default: validate
      full_history:
        description: 'Recalculate all historical months'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bea-data-update
  cancel-in-progress: false
jobs:
  calculate:
    if: github.event_name != 'schedule' || vars.BEA_AUTO_UPDATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      data_changed: ${{ steps.update.outputs.data_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: python -m pip install -r automation/requirements.txt
      - name: Verify calculation against fixed Stata reference
        run: python -m unittest discover -s automation/tests -v
      - name: Download, calculate and validate
        id: update
        env:
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          UPDATE_MODE: ${{ github.event_name == 'schedule' && 'update' || inputs.mode }}
          FULL_HISTORY: ${{ inputs.full_history }}
        run: |
          args=(--mode "$UPDATE_MODE")
          if [ "$FULL_HISTORY" = 'true' ]; then args+=(--full-history); fi
          python automation/update.py "${args[@]}"
      - name: Commit validated release
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ism_data.csv ismi_data.xlsx automation/state.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update ISMI from BEA through ${{ steps.update.outputs.latest_month }}'
          git push origin HEAD:main
      - name: Save validation report and candidate downloads
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ismi-validation-${{ github.run_id }}
          path: update-artifacts/
          retention-days: 30
          if-no-files-found: ignore
  publish:
    needs: calculate
    if: needs.calculate.outputs.data_changed == 'true' && (github.event_name == 'schedule' || inputs.mode != 'validate')
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
