name: Publish website
on:
  push:
    branches: [main]
    paths: ['ism_webapp.html', 'ism_data.csv', 'ismi_data.xlsx', 'data-update.json', 'analytics-preferences.html', 'preview.png', 'automation/package_site.py', 'automation/preview/**', '.github/workflows/*pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publish:
    uses: ./.github/workflows/deploy-pages.yml
